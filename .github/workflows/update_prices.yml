name: Update SGX Xtrackers backfill

on:
  schedule:
    # 22:30 UTC Mon-Fri = 06:30 SGT Tue-Sat, after the US close (incl. daylight-saving shifts)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Redownload the full 10-year history (ignore stored data)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices and rebuild backfill
        id: fetch
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.full_backfill }}" = "true" ]; then
            python fetch_prices.py --full
          else
            python fetch_prices.py
          fi

      - name: Commit data (even after a partial failure, so status.json records it)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Fail the run if a required feed failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "A required symbol failed - see data/status.json"
          exit 1
