name: Update SGX Xtrackers backfill

on:
  schedule:
    # 22:30 UTC Mon-Fri = 06:30 SGT Tue-Sat, after the US close
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Redownload the full 10-year history (ignore stored data)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check required files are in the repo
        run: |
          ls -la
          for f in fetch_prices.py tickers.json; do
            [ -f "$f" ] || { echo "MISSING at repo root: $f"; exit 1; }
          done

      - name: Install dependencies
        run: pip install "yfinance>=0.2.54" "pandas>=2.0"

      - name: Fetch prices and rebuild backfill
        id: fetch
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.full_backfill }}" = "true" ]; then
            python fetch_prices.py --full
          else
            python fetch_prices.py
          fi

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Fail the run if a required feed failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "A required symbol failed - see data/status.json"
          exit 1
